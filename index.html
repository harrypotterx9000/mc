<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OpusMC</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
    touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #ui { pointer-events: none; }
  #textinput { position: absolute; display: none; background: transparent; border: none; outline: none; color: transparent;
    caret-color: transparent; font-family: monospace; padding: 0 2px; z-index: 5; }
  #err { position: absolute; left: 10%; top: 30%; width: 80%; color: #fff; font: 18px sans-serif; white-space: pre-wrap; display: none; text-align: center; }
  #boot { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; font: 16px "Microsoft YaHei", sans-serif; background: #ef323d; }
  #boot b { font-size: 30px; letter-spacing: 2px; margin-bottom: 18px; }
  #bootbar { width: min(320px, 70vw); height: 10px; border: 2px solid #fff; padding: 2px; box-sizing: content-box; }
  #bootbar i { display: block; height: 100%; width: 0; background: #fff; }
  #boottext { margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ui"></canvas>
<input id="textinput" type="text" autocomplete="off" spellcheck="false">
<div id="boot"><b>OpusMC</b><div id="bootbar"><i></i></div><div id="boottext">正在加载… 0%</div></div>
<script>
  // the loading bar: the game's scripts as they arrive (how many there are: counted in this page itself), then the
  // start-up (textures, the title world) creeping on until the title screen is up
  (function () {
    var bar = document.querySelector('#bootbar i'), txt = document.getElementById('boottext'), total = 85, got = 0, shown = 0;
    try { fetch(location.href, { cache: 'force-cache' }).then(function (r) { return r.text(); }).then(function (t) { var n = (t.match(/<script src=/g) || []).length; if (n) total = n; }).catch(function () { }); } catch (e) { }
    document.addEventListener('load', function (e) { if (e.target && e.target.tagName === 'SCRIPT' && e.target.src) got++; }, true);
    (function step() {
      var b = document.getElementById('boot'); if (!b || b.style.display === 'none') return;
      var want = got < total ? 85 * got / total : 85 + 14 * (1 - Math.exp(-(performance.now() - (step.t || (step.t = performance.now()))) / 4000));
      shown = Math.max(shown, Math.min(99, want));
      bar.style.width = shown.toFixed(1) + '%';
      txt.textContent = (got < total ? '正在加载… ' : '正在准备世界… ') + Math.floor(shown) + '%';
      setTimeout(step, 100);
    })();
  })();
</script>
