<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1b1b">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>OpusMC</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
    touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #ui { pointer-events: none; }
  #textinput { position: absolute; display: none; background: transparent; border: none; outline: none; color: transparent;
    caret-color: transparent; font-family: monospace; padding: 0 2px; z-index: 5; }
  #err { position: absolute; left: 10%; top: 30%; width: 80%; color: #fff; font: 18px sans-serif; white-space: pre-wrap; display: none; text-align: center; z-index: 20; }
  #boot { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; font: 16px "Microsoft YaHei", sans-serif; background: #ef323d; z-index: 10; }
  #boot b { font-size: 30px; letter-spacing: 2px; margin-bottom: 18px; }
  #bootbar { width: min(320px, 70vw); height: 10px; border: 2px solid #fff; padding: 2px; box-sizing: content-box; }
  #bootbar i { display: block; height: 100%; width: 0; background: #fff; }
  #boottext { margin-top: 10px; font-size: 14px; text-align: center; max-width: 80vw; }
  #compat { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    box-sizing: border-box; background: rgba(8, 8, 8, 0.94); color: #f2f2f2; font: 15px/1.55 "Microsoft YaHei", system-ui, sans-serif; }
  #compat[hidden] { display: none !important; }
  #compat-card { width: min(780px, 100%); max-height: 94vh; overflow: auto; box-sizing: border-box; padding: 24px 26px;
    border: 1px solid #5a5a5a; background: #1b1b1b; box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6); }
  #compat h1 { margin: 0 0 10px; font-size: 22px; line-height: 1.3; color: #ffd24a; }
  #compat p { margin: 8px 0; }
  #compat ul { margin: 12px 0; padding-left: 22px; text-align: left; }
  #compat li { margin: 7px 0; }
  #compat li b { color: #ff8a80; }
  #compat-detail { margin: 14px 0; padding: 10px 12px; max-height: 210px; overflow: auto; background: #0f0f0f;
    border: 1px solid #333; color: #c8c8c8; font: 12px/1.5 Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  #compat-retry { margin-top: 4px; padding: 9px 22px; border: 1px solid #d7b02a; background: #ffd24a; color: #1b1b1b;
    font: bold 15px "Microsoft YaHei", sans-serif; cursor: pointer; }
  #compat-hint { margin-top: 12px; color: #ffd24a; font-size: 13px; }
  #compat code { padding: 1px 5px; background: #000; color: #fff; }
  noscript { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 40;
    padding: 24px; background: #1b1b1b; color: #fff; font: 16px/1.6 "Microsoft YaHei", sans-serif; text-align: center; }
</style>

<body>
<canvas id="gl"></canvas>
<canvas id="ui"></canvas>
<input id="textinput" type="text" autocomplete="off" spellcheck="false">
<div id="boot"><b>OpusMC</b><div id="bootbar"><i></i></div><div id="boottext">正在加载… 0%</div></div>
<div id="err"></div>
<div id="compat" role="alert" aria-live="assertive" hidden>
  <div id="compat-card">
    <h1 id="compat-title">无法启动 OpusMC</h1>
    <p id="compat-summary"></p>
    <ul id="compat-list"></ul>
    <pre id="compat-detail"></pre>
    <div><button id="compat-retry" type="button">重新检测</button></div>
    <p id="compat-hint"></p>
  </div>
</div>
<noscript>OpusMC 需要 JavaScript 才能运行。请在浏览器设置中启用 JavaScript，然后刷新页面。</noscript>
<script>
  // The loading bar: the 87 game scripts as they arrive, then start-up (textures, title world) creeping on until
  // the title screen is up. Errors are shown instead of leaving a dead 99% bar.
  // (No extra fetch of this page: the page itself is already being parsed.)
  (function () {
    var bar = document.querySelector('#bootbar i'), txt = document.getElementById('boottext'), total = 87, got = 0, shown = 0, failed = [];
    window.__BOOT_TOTAL__ = total;
    window.__BOOT_FAILED__ = failed;
    function bootError(msg) {
      failed.push(msg);
      var e = document.getElementById('err'), b = document.getElementById('boot');
      if (e) { e.style.display = 'block'; e.textContent = msg; }
      if (txt) txt.textContent = '加载失败';
      if (bar) bar.style.width = '100%';
      if (b) b.style.background = '#421414';
      console.error('[OpusMC boot] ' + msg);
    }
    window.__BOOT_ERROR__ = bootError;
    var sameOrigin = function (src) {
      try { return new URL(src, location.href).origin === location.origin; } catch (x) { return false; }
    };
    document.addEventListener('load', function (e) {
      if (!e.target || e.target.tagName !== 'SCRIPT' || !e.target.src || !sameOrigin(e.target.src)) return;
      got++;
      window.__BOOT_LOADED__ = got;
    }, true);
    document.addEventListener('error', function (e) {
      if (!e.target || e.target.tagName !== 'SCRIPT' || !e.target.src || !sameOrigin(e.target.src)) return;
      var name = e.target.src.split('/').slice(-2).join('/');
      bootError('资源加载失败：' + name + '\n请确认是通过 http(s):// 打开游戏（不是双击 index.html），然后刷新重试。');
    }, true);
    // a file the browser blocked (a Worker script, an extension) is a console error, not a failed <script>:
    // give the title world a generous limit, then say what to do instead of waiting for ever.
    setTimeout(function () {
      if (!window.game || (window.game.state === 'boot' && !failed.length)) {
        bootError('启动超时：页面没有完成初始化。\n请使用最新版 Chrome / Edge / Safari，确认已通过 http://127.0.0.1:8080/ 打开，并检查浏览器控制台的红色错误。');
      }
    }, 90000);
    (function step() {
      var b = document.getElementById('boot'); if (!b || b.style.display === 'none') return;
      // the 87 static page scripts are the bar; lazy scripts added later (sound_events.js and friends) must not
      // stretch it, they are part of "preparing the world"
      var want = got < total ? 85 * Math.min(got, total) / total : 85 + 14 * (1 - Math.exp(-(performance.now() - (step.t || (step.t = performance.now()))) / 4000));
      shown = Math.max(shown, Math.min(99, want));
      if (bar) bar.style.width = shown.toFixed(1) + '%';
      if (txt && !failed.length) txt.textContent = (got < total ? '正在加载… ' : '正在准备世界… ') + Math.floor(shown) + '%';
      setTimeout(step, 100);
    })();
  })();
</script>
